<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./src/output.css">
  <link rel="stylesheet" href="./src/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <title>Pokemon API</title>
</head>

<body>
  <!-- Header will contain the search bar and the toggler for the fav sidebar -->
  <header class="my-7 flex justify-center align-middle">

    <!-- <div class="">
      <img src="./Assets/Toggle Icon.png" class="flex" alt="Toggle Favorite Pokemon.">
    </div> -->

    <form class="mx-auto search-bar flex justify-center" style="height: 70px;">
      <input type="search" id="default-search"
        class=" block w-full p-4 text-sm border-gray-300 rounded-lg bg-white focus:ring-blue-500 focus:border-blue-500 dark:border-gray-600 dark:placeholder-gray-400 dark:text-black dark:focus:ring-blue-500 dark:focus:border-blue-500 "
        placeholder="Enter a Name or Pokedex number!" required />
      <img id="randomPokeBtn" type="submit" class="iconBtn my-auto pe-5" src="./Assets/Shuffle-icon.png"
        alt="Randomize Pokemon Search!">
      <img id="searchPokeBtn" type="submit" class="iconBtn my-auto pe-5" src="./Assets/Search-icon.png"
        alt="Search for Pokemon Button!">
    </form>
    <!-- 
    <nav class="bg-neutral-primary fixed w-full z-20 top-0 start-0 border-b border-default">
      <div class="max-w-7xl flex flex-wrap items-center justify-center mx-auto p-4">
        
        <div class="">
          <img src="./Assets/Toggle Icon.png" class="" alt="Toggle Favorite Pokemon.">
        </div>

        <form class="mx-auto search-bar flex justify-center" style="height: 70px;">
          <input type="search" id="default-search"
            class=" block w-full p-4 text-sm border-gray-300 rounded-lg bg-white focus:ring-blue-500 focus:border-blue-500 dark:border-gray-600 dark:placeholder-gray-400 dark:text-black dark:focus:ring-blue-500 dark:focus:border-blue-500 "
            placeholder="Enter a Name or Pokedex number!" required />
          <img id="randomPokeBtn" type="submit" class="iconBtn my-auto pe-5" src="./Assets/Shuffle-icon.png"
            alt="Randomize Pokemon Search!">
          <img id="searchPokeBtn" type="submit" class="iconBtn my-auto pe-5" src="./Assets/Search-icon.png"
            alt="Search for Pokemon Button!">
        </form>
      </div>
    </nav> -->
  </header>
  <!-- Here is the main body within one major grid! -->
  <section class="main-grid gap-x-9 gap-y-9 mx-auto mb-5" style="width: 1128px;">
    <!-- Display the main pokemon searched! -->
    <div class="white-box p-3 col-start-1" style="height: 321px; width: 470px;">
      <div class="flex">
        <h2 class="pe-4" style="font-size: 40px;">Eevee</h2>
        <img src="./Assets/Star 1.png" alt="Toggle Favorites Star!">
        <img class="ms-auto" src="./Assets/audio 1.png" alt="Toggle Pokemon Cries!">
      </div>

      <div class="grid grid-cols-2 mb-9">
        <img style="width: 160px;" src="./Assets/133Eevee.png" alt="Pokemon Called">
        <img style="width: 160px;" src="./Assets/133Shiny.png" alt="Shiny Pokemon Called">
      </div>

      <div class="flex">
        <img src="./Assets/normalType.png" alt="First pokemon's typing">
        <img class="ps-2.5" src="./Assets/normalType.png" alt="Second typing">
      </div>
    </div>

    <!-- Display the evolution line! -->
    <div class="white-box col-start-1" style="height: 478px; width: 470px;">
      <h1 class="text-center" style="font-size: 24px;">Evolution</h1>
      <div id="firstEvol"></div>

      <div id="secondEvol"></div>

      <div id="thirdEvol"></div>
    </div>

    <!-- Base Stats and Abilities -->
    <div class="col-start-2 row-start-1 grid grid-cols-2">
      <div class="white-box p-3" style="width: 302px;">
        <h2 class="pb-3" style="font-size: 24px;">Base Stats</h2>
        <div class="grid grid-cols-2">
          <div class="pe-1">
            <p class="text-end">HP: </p>
            <p class="text-end">Attack: </p>
            <p class="text-end">Defense: </p>
            <p class="text-end">Special Attack: </p>
            <p class="text-end">Special Defense: </p>
            <p class="text-end">Speed: </p>
          </div>
          <div class="col-start-2">
            <p>0</p>
            <p>0</p>
            <p>0</p>
            <p>0</p>
            <p>0</p>
            <p>0</p>
          </div>
        </div>
        <h3 class="mt-auto" id="totalPokeStat">Total Stats: 325</h3>
      </div>

      <div class="white-box ms-auto p-3" style="width: 302px;">
        <h2 class="pb-3" style="font-size: 24px;">Abilities</h2>
        <p id="hiddenAbility">Hidden Ability: Anticipation</p>
        <p id="abilitites">Run Away, Adaptability</p>
      </div>
    </div>

    <!-- All Moves: -->
    <div class="white-box"></div>

    <!-- Locations: -->


  </section>


  <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
  <script type="module" src="./Scripts/app.js"></script>
</body>

</html>
